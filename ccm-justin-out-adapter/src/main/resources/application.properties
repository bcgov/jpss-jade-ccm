quarkus.kafka.devservices.enabled=false
quarkus.kafka-streams.bootstrap-servers=${KAFKA-BROKER-URL:events_broker:9093}

quarkus.openshift.image-stream.name=ccm-justin-out-adapter
quarkus.kubernetes.deployment-kind=StatefulSet
quarkus.kubernetes.name=ccm-justin-out-adapter
quarkus.kubernetes.replicas=1

quarkus.kafka-streams.application-id=ccm-justin-out-adapter
quarkus.log.console.color=true
quarkus.log.category."getFileCloseData".level=DEBUG
## quarkus.log.console.format=%z{America/Los_Angeles}
quarkus.log.console.level=DEBUG

camel.component.kafka.brokers = {{kafka-broker-url}}
##events-kafka-bootstrap:9092

# Logging - Timezone setting
# https://quarkus.io/guides/logging


# justin.host = https://dev.jag.gov.bc.ca/ords/devj/justinords/dems/v1
justin.host = {{justin-host-url}}
