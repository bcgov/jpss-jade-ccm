name: ccm-accessdedup-processor
# namespace will be set via --set namespace=<value> from pipeline
namespace: ""
app: jade-ccm
version: 1.6-1

# Default replicas (can be overridden via --set replicas=<value>)
# Dev/Test: 2, Prod: 3
replicas: 2

service:
  type: ClusterIP
  port: 80

strategy:
  maxUnavailable: 25%
  maxSurge: 25%

container:
  name: container

# Image repository will be set via --set image.repository=<value> from pipeline
image:
  repository: ""
  tag: latest
  pullPolicy: Always

env:
  - name: TZ
    value: Canada/Pacific
  - name: QUARKUS_LOG_LEVEL
    value: INFO
  - name: QUARKUS_LOG_CONSOLE_JSON
    value: "false"
  - name: QUARKUS_LOG_CONSOLE_COLOR
    value: "true"
  - name: QUARKUS_KAFKA_STREAMS_BOOTSTRAP_SERVERS
    value: "events-kafka-bootstrap:9092"

envFrom:
  - configMapRef:
      name: ccm-quarkus-configs
  - secretRef:
      name: ccm-quarkus-secrets

# Health probes using Quarkus SmallRye Health endpoints
livenessProbe:
  httpGet:
    path: /q/health/live
    port: 8080
    scheme: HTTP
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /q/health/ready
    port: 8080
    scheme: HTTP
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Pod anti-affinity to spread pods across nodes (all environments)
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - ccm-app
        topologyKey: kubernetes.io/hostname

# Pod Disruption Budget (disabled by default, enabled for prod via --set)
podDisruptionBudget:
  enabled: false
  minAvailable: 1

volumes:
  - name: kafka-cluster-ca-cert
    secret:
      secretName: events-cluster-ca-cert
volumeMounts:
  - name: kafka-cluster-ca-cert
    mountPath: /etc/kafka-certs
    readOnly: true
