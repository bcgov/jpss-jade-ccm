name: ccm-accessdedup-processor
# namespace will be set via --set namespace=<value> or from environment-specific values
namespace: ""
app: jade-ccm
version: 1.6-1

replicas: 1

service:
  type: ClusterIP
  port: 80

strategy:
  maxUnavailable: 25%
  maxSurge: 25%

container:
  name: container

image:
  repository: image-registry.openshift-image-registry.svc:5000/cef5dd-test/ccm-accessdedup-processor
  tag: latest
  pullPolicy: Always

env:
  - name: TZ
    value: Canada/Pacific
  - name: QUARKUS_LOG_LEVEL
    value: INFO
  - name: QUARKUS_LOG_CONSOLE_JSON
    value: "false"
  - name: QUARKUS_LOG_CONSOLE_COLOR
    value: "true"
envFrom:
  - configMapRef:
      name: ccm-quarkus-configs
  - secretRef:
      name: ccm-quarkus-secrets

# Health probes using Quarkus SmallRye Health endpoints
livenessProbe:
  httpGet:
    path: /q/health/live
    port: 8080
    scheme: HTTP
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /q/health/ready
    port: 8080
    scheme: HTTP
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

volumes: []
volumeMounts: []
