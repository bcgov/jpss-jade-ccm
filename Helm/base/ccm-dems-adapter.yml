name: ccm-dems-adapter
# namespace will be set via --set namespace=<value> from pipeline
namespace: ""
app: jade-ccm
version: 1.6-1

# Default replicas (can be overridden via --set replicas=<value>)
# Dev/Test: 2, Prod: 3
replicas: 2

service:
  type: ClusterIP
  port: 80

strategy:
  maxUnavailable: 25%
  maxSurge: 25%

container:
  name: container
  command:
    - /bin/sh
    - -c
  args:
    - echo exec java -Xmx525M -cp ... # (trimmed for Helm)
  resources:
    requests:
      cpu: 5m
      memory: 500Mi
    limits:
      cpu: 200m
      memory: 1000Mi

# Image repository will be set via --set image.repository=<value> from pipeline
image:
  repository: ""
  tag: latest
  pullPolicy: Always

# Health probes using Quarkus SmallRye Health endpoints
livenessProbe:
  httpGet:
    path: /q/health/live
    port: 8080
    scheme: HTTP
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /q/health/ready
    port: 8080
    scheme: HTTP
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

env:
  - name: TZ
    value: Canada/Pacific
  - name: QUARKUS_LOG_LEVEL
    value: INFO
  - name: QUARKUS_LOG_CONSOLE_JSON
    value: "false"
  - name: QUARKUS_LOG_CONSOLE_COLOR
    value: "true"

volumeMounts: []
envFrom:
  - configMapRef:
      name: ccm-quarkus-configs
  - secretRef:
      name: ccm-quarkus-secrets

volumes: []
labels:
  integration: ccm-dems-adapter
  camel_generation: "1"

annotations:
  camel_operator_id: camel-k

# Pod Disruption Budget (disabled by default, enabled for prod via --set)
podDisruptionBudget:
  enabled: false
  minAvailable: 1
