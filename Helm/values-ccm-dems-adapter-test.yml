# Environment-specific values for ccm-dems-adapter in TEST
# This file extends values-ccm-dems-adapter.yml

# Multinode configuration for test environment
replicas: 2

# Pod anti-affinity to ensure pods are spread across different nodes
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - ccm-app
        topologyKey: kubernetes.io/hostname

# Pod Disruption Budget - ensure at least 1 pod available during updates
podDisruptionBudget:
  enabled: true
  minAvailable: 1
