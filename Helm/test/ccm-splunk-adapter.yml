# Environment-specific values for ccm-splunk-adapter in TEST
# This file extends values-ccm-splunk-adapter.yml

# Multinode configuration for test environment
replicas: 2

# Override image repository for test environment
image:
  repository: image-registry.apps.silver.devops.gov.bc.ca/cef5dd-test/ccm-splunk-adapter
  tag: latest
  pullPolicy: Always

# Pod anti-affinity to ensure pods are spread across different nodes
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - ccm-app
        topologyKey: kubernetes.io/hostname

# Pod Disruption Budget - ensure at least 1 pod available during updates
podDisruptionBudget:
  enabled: true
  minAvailable: 1
