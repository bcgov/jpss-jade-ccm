# Environment-specific values for ccm-accessdedup-processor in TEST
# This file extends values-ccm-accessdedup.yml

# Multinode configuration for test environment
replicas: 2

# Override image repository for test environment
image:
  repository: image-registry.apps.silver.devops.gov.bc.ca/cef5dd-test/ccm-accessdedup-processor
  tag: latest
  pullPolicy: Always

# Pod anti-affinity to ensure pods are spread across different nodes
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - ccm-app
        topologyKey: kubernetes.io/hostname

# Pod Disruption Budget - ensure at least 1 pod available during updates
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Test environment uses port 9093 for Kafka Streams
# Override all env vars from base to include environment-specific Kafka config
env:
  - name: TZ
    value: Canada/Pacific
  - name: QUARKUS_LOG_LEVEL
    value: INFO
  - name: QUARKUS_LOG_CONSOLE_JSON
    value: "false"
  - name: QUARKUS_LOG_CONSOLE_COLOR
    value: "true"
  - name: QUARKUS_KAFKA_STREAMS_BOOTSTRAP_SERVERS
    value: "events-kafka-bootstrap:9092"
