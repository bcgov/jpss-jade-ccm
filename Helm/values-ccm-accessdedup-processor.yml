name: ccm-accessdedup-processor
# namespace will be set via --set namespace=<value> or from environment-specific values
namespace: ""
app: jade-ccm
version: 1.6-1

replicas: 1

service:
  type: ClusterIP
  port: 80

strategy:
  maxUnavailable: 25%
  maxSurge: 25%

container:
  name: container

image:
  repository: image-registry.openshift-image-registry.svc:5000/cef5dd-test/ccm-accessdedup-processor
  tag: latest
  pullPolicy: Always

env:
  timezone: Canada/Pacific
  kafkaBroker: events-kafka-bootstrap:9092

strategy:
  maxUnavailable: 25%
  maxSurge: 25%
envFrom:
  - configMapRef:
      name: ccm-quarkus-configs
  - secretRef:
      name: ccm-quarkus-secrets

volumes: []
volumeMounts: []
