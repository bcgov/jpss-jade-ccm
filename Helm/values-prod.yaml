# Environment overlay: PROD (cef5dd-prod)
#
#   helm upgrade --install ccm-app ./Helm -n cef5dd-prod -f Helm/values-prod.yaml
#
# Prod is intentionally SELF-CONTAINED: useShared:false makes the template render
# only the keys below, so prod never inherits a shared default it does not have
# (e.g. quarkus.kafka-streams.bootstrap-servers, which is not present in prod).
# These values mirror the live cef5dd-prod ConfigMap exactly (captured 2026-07-31).

quarkusConfig:
  enabled: false          # enabled explicitly by the CI ConfigMap step (--set quarkusConfig.enabled=true)
  name: ccm-quarkus-configs
  useShared: false        # do NOT merge quarkusConfig.shared for prod

  env:
    # Kafka
    kafka-broker-url: events-kafka-bootstrap:9092

    # DEMS (prod)
    dems-case-auto-creation: "true"
    dems-case-auto-creation-submit-date-cutoff: "15"
    dems-case-template-id: "9"
    dems-org-unit-id: "1"
    dems-host-url: wsgw.jag.gov.bc.ca/bcpsdems/api/v1
    dems-case-hyperlink-prefix: https://dems.bcps.gov.bc.ca/Edt.aspx#/cases/
    dems-case-hyperlink-suffix: /case-file/1-2--entire-file-basic-columns
    dems-case-hyperlinklist-suffix: /court-file--vcf/1--front-end-court

    # JUSTIN (prod)
    justin-host-url: wsgw.jag.gov.bc.ca/justin/dems/api/v1
    justin-disable-file-notes-processing: "true"

    # PIDP Kafka (prod)
    pidp-kafka-apicurioregistry-url: https://serviceregistry.ag.gov.bc.ca/apis/ccompat/v6
    pidp-kafka-bootstrapservers-url: diam-kafka-prod-a239c6-prod.apps.gold.devops.gov.bc.ca:443
    pidp-kafka-oauth-client-id: digitalevidence-jade-ccm-consumer
    pidp-kafka-oauth-token-endpoint-url: https://common-sso.justice.gov.bc.ca/auth/realms/Kafka/protocol/openid-connect/token
    pidp-kafka-topic-participantmerge-name: digitalevidence-justin-participant-merge-topic
    pidp-kafka-topic-processresponse-name: digitalevidence-processresponse-topic
    pidp-kafka-topic-usercreation-name: digitalevidence-usercreation-plain-topic

    # PIDP API (prod)
    pidp-api-host: https://diam-islinterfaces-e27db1-prod.apps.gold.devops.gov.bc.ca/api/v1/
    pidp-api-oauth-client-id: jade-ccm-webapi-client
    pidp-api-oauth-token-endpoint-url: common-sso.justice.gov.bc.ca/auth/realms/BCPS/protocol/openid-connect/token

    # Splunk
    splunk-host-url: hec.monitoring.ag.gov.bc.ca:8088/services/collector

    # Kafka topic consumer counts
    topic-bulk-chargeassessment-consumer-count: "5"
    topic-chargeassessment-consumer-count: "3"
    topic-courtcase-consumer-count: "3"
    topic-reports-consumer-count: "5"
