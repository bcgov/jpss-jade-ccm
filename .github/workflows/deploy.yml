name: Deploy to OpenShift

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Select the application to deploy'
        required: true
        type: choice
        options:
          - ccm-justin-in-adapter
          - ccm-dems-adapter
          - ccm-lookup-service
          - ccm-splunk-adapter
          - ccm-accessdedup-processor
          - ccm-reports-processor
          - ccm-pidp-adapter
          - ccm-notification-service
          - ccm-justin-events-adapter
          - ccm-justin-out-adapter
      env:
        description: 'Select the environment'
        required: true
        type: choice
        default: 'dev'
        options:
          - dev
          - test
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env }}

    env:
      APP: ${{ github.event.inputs.app }}
      ENV: ${{ github.event.inputs.env }}
      OCP_SERVER: ${{ secrets.OCP_SERVER }}
      OCP_TOKEN: ${{ secrets.OCP_TOKEN }}
      OCP_PROJECT: cef5dd-${{ github.event.inputs.env }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install OpenShift CLI
        run: |
          curl -L https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz -o oc.tar.gz
          tar -xzf oc.tar.gz
          sudo mv oc /usr/local/bin/

      - name: Login to OpenShift
        run: |
          oc login $OCP_SERVER --token=$OCP_TOKEN
          oc project $OCP_PROJECT

      #######################################################################
      # 1. BUILD THE APPLICATION (same as you do locally)
      #######################################################################
      - name: Maven build (Quarkus)
        run: |
          mvn -q -f $APP/pom.xml clean package -DskipTests

      #######################################################################
      # 2. BUILD DOCKER IMAGE (same as local)
      #######################################################################
      - name: Build Docker image
        run: |
          docker build -t $APP -f $APP/Dockerfile .

      #######################################################################
      # 3. LOGIN TO OPENSHIFT INTERNAL REGISTRY
      #######################################################################
      - name: Login to internal OpenShift registry
        run: |
          oc registry login --to=/tmp/ocp-auth.json
          REGISTRY=$(oc get route -n openshift-image-registry default-route -o jsonpath='{.spec.host}')
          echo "REGISTRY=$REGISTRY" >> $GITHUB_ENV

      #######################################################################
      # 4. PUSH IMAGE TO IMAGESTREAM
      #######################################################################
      - name: Tag and push image
        run: |
          docker tag $APP ${REGISTRY}/${OCP_PROJECT}/${APP}:latest
          docker push ${REGISTRY}/${OCP_PROJECT}/${APP}:latest

      #######################################################################
      # 5. TRIGGER ROLLOUT / APPLY DEPLOYMENT YAML
      #######################################################################
      - name: Deploy to OpenShift
        run: |
          oc rollout restart deploy/${APP} || echo "Deployment not found — skipping rollout"
          sleep 5
          oc rollout status deploy/${APP} || echo "Rollout may still be progressing"
