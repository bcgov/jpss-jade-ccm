name: Deploy to OpenShift

permissions: 
  id-token: write  
  contents: read 
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Select the application to deploy"
        required: true
        type: choice
        options:
          - ccm-justin-in-adapter
          - ccm-dems-adapter
          - ccm-lookup-service
          - ccm-splunk-adapter
          - ccm-accessdedup-processor
          - ccm-reports-processor
          - ccm-pidp-adapter
          - ccm-notification-service
          - ccm-justin-events-adapter
          - ccm-justin-out-adapter

      env:
        description: "Environment"
        required: true
        type: choice
        default: "dev"
        options:
          - dev
          - test
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env }}

    env:
      APP: ${{ github.event.inputs.app }}
      ENV: ${{ github.event.inputs.env }}
      OCP_SERVER: ${{ secrets.OCP_SERVER }}
      OCP_TOKEN: ${{ secrets.OCP_TOKEN }}
      OCP_PROJECT: cef5dd-${{ github.event.inputs.env }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # ---------------------------
      # Install OC CLI
      # ---------------------------
      - name: Install OpenShift CLI
        run: |
          curl -L https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz -o oc.tar.gz
          tar -xzf oc.tar.gz
          sudo mv oc /usr/local/bin/oc

      # ---------------------------
      # Login to OpenShift
      # ---------------------------
      - name: Login to OpenShift
        run: |
          oc login $OCP_SERVER --token=$OCP_TOKEN
          oc project $OCP_PROJECT

      # ---------------------------
      # Repackage CCM MODELS
      # (this recreates ccm-models.jar exactly like your local box)
      # ---------------------------
      - name: Repackage CCM models
        run: |
          echo "🏗️ Repackaging CCM models..."

          mkdir -p target/classes
          find src/main/java/ccm/models src/main/java/ccm/utils -type f -name "*.java" > target/model_sources.txt

          if [ ! -s target/model_sources.txt ]; then
            echo "❌ No model classes found!"
            exit 1
          fi

          javac --release 17 -d target/classes @target/model_sources.txt
          jar cf target/classes/ccm-models.jar -C target/classes ccm/models -C target/classes ccm/utils

          echo "📦 ccm-models.jar built:"
          ls -lh target/classes/ccm-models.jar

      # ---------------------------
      # Build selected CCM app
      # ---------------------------
      - name: Build selected CCM app
        run: |
          echo "Building $APP ..."
          mvn -q -f $APP/pom.xml clean package -DskipTests

      # ---------------------------
      # Build Container Image
      # ---------------------------
      - name: Build Docker image
        run: |
          IMAGE="image-registry.openshift-image-registry.svc:5000/$OCP_PROJECT/$APP:latest"
          echo "Building image: $IMAGE"
          docker build -t $IMAGE -f $APP/Dockerfile .

      # ---------------------------
      # Push Image to OpenShift Internal Registry
      # ---------------------------
      - name: Push image to OpenShift internal registry
        run: |
          IMAGE="image-registry.openshift-image-registry.svc:5000/$OCP_PROJECT/$APP:latest"

          echo "🔐 Logging into image registry..."
          docker login -u kubeadmin -p "$OCP_TOKEN" image-registry.openshift-image-registry.svc:5000

          echo "⬆️ Pushing image..."
          docker push $IMAGE

      # ---------------------------
      # Run redeploy script
      # ---------------------------
      - name: Deploy using jade-ccm scripts
        run: |
          echo "🚀 Running redeploy script for $APP ..."
          cd scripts/jade-ccm

          if [[ -f "./redeploy-$APP" ]]; then
            chmod +x ./redeploy-$APP
            ./redeploy-$APP $ENV
          else
            echo "❌ No redeploy script found for $APP"
            exit 1
          fi

      - name: Deployment Complete
        run: echo "🎉 Deployment completed successfully!"
