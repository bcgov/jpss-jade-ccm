name: Deploy to OpenShift

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Select the application to deploy'
        required: true
        type: choice
        options:
          - ccm-justin-in-adapter
          - ccm-dems-adapter
          - ccm-lookup-service
          - ccm-splunk-adapter
          - ccm-accessdedup-processor
          - ccm-reports-processor
          - ccm-pidp-adapter
          - ccm-notification-service
          - ccm-justin-events-adapter
          - ccm-justin-out-adapter
      env:
        description: 'Select the environment'
        required: true
        type: choice
        default: dev
        options: [dev, test, prod]

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.app }} to ${{ github.event.inputs.env }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env }}

    env:
      APP: ${{ github.event.inputs.app }}
      ENV: ${{ github.event.inputs.env }}
      OCP_SERVER: ${{ secrets.OCP_SERVER }}
      OCP_TOKEN: ${{ secrets.OCP_TOKEN }}
      OCP_PROJECT: cef5dd-${{ github.event.inputs.env }}

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17 (Temurin) + Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 🔧 Install OpenShift CLI (oc)
        run: |
          set -e
          curl -L https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz -o oc.tar.gz
          tar -xzf oc.tar.gz
          sudo mv oc /usr/local/bin/
          rm -f oc.tar.gz
          oc version --client

      - name: 🔐 Login to OpenShift
        run: |
          set -e
          oc login "$OCP_SERVER" --token="$OCP_TOKEN"
          oc project "$OCP_PROJECT"

      - name: 🔑 Login Docker to OpenShift image registry
        run: |
          set -e
          echo "Logging Docker into internal OpenShift registry..."
          REGISTRY=image-registry.apps.silver.devops.gov.bc.ca
          TOKEN=$(oc whoami -t)
          docker login -u "$(oc whoami)" -p "$TOKEN" "$REGISTRY"

      # ------------------------------------------------------------
      # STEP 1: Repackage CCM models into target/classes/ccm-models.jar
      # ------------------------------------------------------------
      - name: 🧱 Repackage CCM models (compile & jar)
        run: |
          set -e
          echo "📦 Preparing CCM models jar at target/classes/ccm-models.jar"

          java -version
          mvn -version

          mkdir -p target/classes
          mvn -q -f pom.xml dependency:build-classpath -DincludeScope=compile -Dmdep.outputFile=target/cp.txt
          CP=$(cat target/cp.txt)

          find src/main/java/ccm -type f -name '*.java' > target/ccm_sources.txt
          if [ ! -s target/ccm_sources.txt ]; then
            echo "❌ No CCM Java sources found under src/main/java/ccm"
            exit 1
          fi

          javac --release 17 -cp "$CP" -d target/classes @target/ccm_sources.txt
          (cd target/classes && jar cf ccm-models.jar ccm)
          ls -lh target/classes/ccm-models.jar

      # ------------------------------------------------------------
      # STEP 2: Build selected Quarkus adapter
      # ------------------------------------------------------------
      - name: 🧩 Build selected Quarkus app
        run: |
          set -e
          echo "🏗️ Building selected app: $APP ..."
          test -f "$APP/pom.xml" || { echo "❌ No pom.xml in $APP"; exit 1; }
          mvn -B -f "$APP/pom.xml" clean package -DskipTests

      # ------------------------------------------------------------
      # STEP 3: Deploy via existing script
      # ------------------------------------------------------------
      - name: 🚀 Deploy Quarkus Service
        run: |
          set -e
          echo "Checking for redeploy script: ./redeploy-$APP"
          if [[ -f "./redeploy-$APP" ]]; then
            chmod +x "./redeploy-$APP"
            chmod -R +x ./scripts/jade-ccm/
            ./redeploy-$APP "$ENV"
          else
            echo "❌ Redeploy script not found for $APP"
            exit 1
          fi

      # ------------------------------------------------------------
      # STEP 4: Verify rollout
      # ------------------------------------------------------------
      - name: ✅ Verify rollout status
        if: success()
        run: |
          echo "⏳ Waiting for rollout of $APP in $OCP_PROJECT..."
          oc rollout status deployment/$APP -n $OCP_PROJECT --timeout=180s || \
          (echo "⚠️ Rollout may have failed. Listing pods:" && oc get pods -n $OCP_PROJECT | grep $APP)
