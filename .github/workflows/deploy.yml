name: Deploy to OpenShift

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Target OpenShift project/cluster (namespace prefix)'
        required: true
        type: choice
        options:
          - cef5dd
          - ac13ae

      app:
        description: 'Application to deploy'
        required: true
        type: choice
        options:
          - ccm-justin-in-adapter
          - ccm-dems-adapter
          - ccm-lookup-service
          - ccm-splunk-adapter
          - ccm-accessdedup-processor
          - ccm-reports-processor
          - ccm-pidp-adapter
          - ccm-notification-service
          - ccm-justin-events-adapter
          - ccm-justin-out-adapter

      env:
        description: 'Deployment environment'
        required: true
        type: choice
        default: dev
        options:
          - dev
          - test
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env }}

    env:
      PROJECT: ${{ github.event.inputs.project }}
      APP: ${{ github.event.inputs.app }}
      ENV: ${{ github.event.inputs.env }}

      # Derived OpenShift project namespace
      OCP_PROJECT: ${{ github.event.inputs.project }}-${{ github.event.inputs.env }}

      # Dynamic secret injection
      OCP_SERVER: ${{ secrets[format('OCP_SERVER_{0}', github.event.inputs.project)] }}
      OCP_TOKEN:  ${{ secrets[format('OCP_TOKEN_{0}', github.event.inputs.project)] }}
      # SA_REGISTRY_PASSWORD: ${{ secrets[format('OC_REG_TOKEN_{0}', github.event.inputs.project)] }}

      # Internal OpenShift registry per cluster
      REGISTRY_HOST: image-registry.apps.${{ github.event.inputs.project }}.devops.gov.bc.ca

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenShift CLI
        run: |
          curl -L https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz -o oc.tar.gz
          tar -xzf oc.tar.gz
          sudo mv oc /usr/local/bin/oc
          oc version --client

      - name: Login to OpenShift
        run: |
          echo "Logging into $PROJECT cluster..."
          oc login "$OCP_SERVER" --token="$OCP_TOKEN"
          oc project "$OCP_PROJECT"

      - name: Login to OpenShift Image Registry
        run: |
          echo "$SA_REGISTRY_PASSWORD" | docker login \
            -u token \
            --password-stdin \
            "$REGISTRY_HOST"

      - name: Install Camel K CLI (kamel)
        run: |
          curl -Lo kamel https://github.com/apache/camel-k/releases/download/v1.10.0/camel-k-client-1.10.0-linux-64bit
          chmod +x kamel
          sudo mv kamel /usr/local/bin/kamel

      - name: Build CCM models jar
        run: |
          chmod +x ./repackage-ccm-models
          ./repackage-ccm-models

      - name: Run Application Deployment Script
        run: |
          cd scripts/jade-ccm
          echo "Checking for deployment script: redeploy-${APP}"

          if [[ -f "redeploy-${APP}" ]]; then
            echo "Deploying $APP to $OCP_PROJECT..."
            chmod +x redeploy-${APP}
            ./redeploy-${APP} "$ENV"
          else
            echo "❌ No deployment script found for $APP"
            exit 1
          fi
