name: Deploy to OpenShift

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Select the application to deploy'
        required: true
        type: choice
        options:
          - ccm-justin-in-adapter
          - ccm-dems-adapter
          - ccm-lookup-service
          - ccm-splunk-adapter
          - ccm-accessdedup-processor
          - ccm-reports-processor
          - ccm-pidp-adapter
          - ccm-notification-service
          - ccm-justin-events-adapter
          - ccm-justin-out-adapter
      env:
        description: 'Environment'
        required: true
        type: choice
        default: dev
        options:
          - dev
          - test
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env }}

    env:
      APP: ${{ github.event.inputs.app }}
      ENV: ${{ github.event.inputs.env }}
      OCP_SERVER: ${{ secrets.OCP_SERVER }}
      OCP_TOKEN: ${{ secrets.OC_BUILD_TOKEN }}
      OCP_PROJECT: cef5dd-${{ github.event.inputs.env }}
      SA_REGISTRY_PASSWORD: ${{ secrets.OC_REG_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenShift CLI
        run: |
          curl -L https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz -o oc.tar.gz
          tar -xzf oc.tar.gz
          sudo mv oc /usr/local/bin/oc

      - name: Login to OpenShift
        run: |
          oc login "$OCP_SERVER" --token="$OCP_TOKEN"
          oc project "$OCP_PROJECT"

      - name: Login to OpenShift Registry
        run: |
          echo "$SA_REGISTRY_PASSWORD" | docker login \
            -u token \
            --password-stdin \
            image-registry.apps.silver.devops.gov.bc.ca


      - name: Install Camel K CLI (kamel)
        run: |
          curl -Lo kamel https://github.com/apache/camel-k/releases/download/v1.10.0/camel-k-client-1.10.0-linux-64bit
          chmod +x kamel
          sudo mv kamel /usr/local/bin/kamel

      - name: Build CCM models jar
        run: |
          chmod +x ./repackage-ccm-models
          ./repackage-ccm-models

      - name: Deploy
        run: |
          cd scripts/jade-ccm
          echo "Checking for: redeploy-$APP"

          if [[ -f "redeploy-${APP}" ]]; then
            chmod +x redeploy-${APP}
            ./redeploy-${APP} "$ENV"
          else
            echo "No deployment script found for $APP"
            exit 1
          fi
