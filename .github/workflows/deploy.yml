name: Deploy to OpenShift (Full Build Mode)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Application"
        type: choice
        required: true
        options:
          - ccm-lookup-service
          - ccm-dems-adapter
          - ccm-splunk-adapter
          - ccm-justin-in-adapter
          - ccm-justin-out-adapter
          - ccm-pidp-adapter
          - ccm-reports-processor
          - ccm-accessdedup-processor
          - ccm-notification-service
          - ccm-justin-events-adapter
      env:
        description: "Environment"
        type: choice
        required: true
        default: dev
        options: [dev, test, prod]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      APP: ${{ github.event.inputs.app }}
      ENV: ${{ github.event.inputs.env }}
      OCP_SERVER: ${{ secrets.OCP_SERVER }}
      OCP_TOKEN: ${{ secrets.OCP_TOKEN }}
      OCP_PROJECT: cef5dd-${{ github.event.inputs.env }}
      REGISTRY: image-registry.apps.${{ github.event.inputs.env }}.devops.gov.bc.ca

    steps:
      - uses: actions/checkout@v4

      - name: Configure Java & Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install oc CLI
        run: |
          curl -L https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz -o oc.tar.gz
          tar -xzf oc.tar.gz
          sudo mv oc /usr/local/bin/

      - name: Login to OpenShift
        run: |
          oc login $OCP_SERVER --token=$OCP_TOKEN
          oc project $OCP_PROJECT

      - name: Login to internal image registry
        run: |
          docker login -u serviceaccount -p ${{ secrets.OCP_DEPLOY_TOKEN }} $REGISTRY

      - name: Build CCM Models JAR
        run: |
          mkdir -p target/classes
          mvn -q dependency:build-classpath -Dmdep.outputFile=target/cp.txt
          CP=$(cat target/cp.txt)
          find src/main/java/ccm -name "*.java" > target/ccm_sources.txt
          javac --release 17 -cp "$CP" -d target/classes @target/ccm_sources.txt
          (cd target/classes && jar cf ccm-models.jar ccm)

      - name: Build Quarkus App
        run: |
          mvn -f $APP/pom.xml clean package -DskipTests

      - name: Build Docker Image
        run: |
          echo "FROM eclipse-temurin:17-focal" > Dockerfile
          echo "COPY $APP/target/*-runner.jar /app/app.jar" >> Dockerfile
          echo 'CMD ["java", "-jar", "/app/app.jar"]' >> Dockerfile
          docker build -t $APP .

      - name: Push to OpenShift ImageStream
        run: |
          docker tag $APP $REGISTRY/$OCP_PROJECT/$APP:latest
          docker push $REGISTRY/$OCP_PROJECT/$APP:latest

      - name: Trigger rollout
        run: |
          oc rollout restart deployment/$APP -n $OCP_PROJECT
          oc rollout status deployment/$APP -n $OCP_PROJECT
