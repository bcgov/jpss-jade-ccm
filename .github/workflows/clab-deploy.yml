name: Deploy to OpenShift

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "Target cluster"
        required: true
        type: choice
        options:
          - cef5dd
          - ac13ae

      app:
        description: 'Application to deploy'
        required: true
        type: choice
        options:
          - ccm-justin-in-adapter
          - ccm-dems-adapter
          - ccm-lookup-service
          - ccm-splunk-adapter
          - ccm-accessdedup-processor
          - ccm-reports-processor
          - ccm-pidp-adapter
          - ccm-notification-service
          - ccm-justin-events-adapter
          - ccm-justin-out-adapter

      env:
        description: 'Environment'
        required: true
        type: choice
        default: dev
        options:
          - dev
          - test
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CLUSTER: ${{ github.event.inputs.cluster }}
      APP: ${{ github.event.inputs.app }}
      ENV: ${{ github.event.inputs.env }}
      OCP_PROJECT: ${{ github.event.inputs.cluster }}-${{ github.event.inputs.env }}

      OCP_SERVER: ${{ secrets[format('OCP_SERVER_{0}', github.event.inputs.cluster)] }}
      OCP_TOKEN:  ${{ secrets[format('OCP_TOKEN_{0}',  github.event.inputs.cluster)] }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenShift CLI
        run: |
          curl -L https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz -o oc.tar.gz
          tar -xzf oc.tar.gz
          sudo mv oc /usr/local/bin/oc

      - name: Login to OpenShift
        run: |
          echo "Logging into $CLUSTER cluster..."
          oc login "$OCP_SERVER" --token="$OCP_TOKEN"
          oc project "$OCP_PROJECT"

      - name: Login to OpenShift Internal Registry
        run: |
          INTERNAL_REGISTRY=$(oc registry info)
          echo "Using registry: $INTERNAL_REGISTRY"

          echo $(oc whoami -t) | docker login \
            -u $(oc whoami) \
            --password-stdin \
            $INTERNAL_REGISTRY

      - name: Install Camel K CLI
        run: |
          curl -Lo kamel https://github.com/apache/camel-k/releases/download/v1.10.0/camel-k-client-1.10.0-linux-64bit
          chmod +x kamel
          sudo mv kamel /usr/local/bin/kamel

      - name: Build CCM models jar
        run: |
          chmod +x ./repackage-ccm-models
          ./repackage-ccm-models

      - name: Deploy Application
        run: |
          cd scripts/jade-ccm
          chmod +x redeploy-${APP}
          ./redeploy-${APP} "$ENV"
